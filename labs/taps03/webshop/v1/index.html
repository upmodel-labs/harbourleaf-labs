<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Search · Practice Bookshop</title>
  <link rel="stylesheet" href="/static/shop.css">
</head>
<body data-page="search" data-basket-word="basket">
  <p class="practice-banner">Practice shop for UpModel labs. Not a real shop: no real books, orders or customers.</p>
  <header class="site-header">
    <a class="site-name" href="/">Practice Bookshop</a>
    
    <nav class="site-nav" aria-label="Main">
      <a href="/">Search</a>
      <a href="/basket.html">Basket (<span id="basket-count" data-testid="basket-count">0</span>)</a>
      <a href="/help.html">Order help</a>
      <a href="/orders.html">Orders</a>
    </nav>
  </header>
  <main class="content">
    <h1>Find a book</h1>
    <section class="card">
      <form id="search-form" class="search-form" role="search" action="/">
        <div class="field">
          <label for="search-box">Search books</label>
          <input id="search-box" name="q" type="search" data-testid="search-box" autocomplete="off">
          <button class="button search-button" type="submit" data-testid="search-button">Search</button>
        </div>
      </form>
    </section>
    <section class="card">
      <p id="search-status" class="status" role="status"></p>
      <ul id="results" class="results" data-testid="results"></ul>
    </section>
  </main>
  <script src="/static/shop.js"></script>
</body>
</html>
